<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Contacto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="theme.toggle()">
        <ion-icon [name]="theme.isDarkMode() ? 'sunny-outline' : 'moon-outline'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="contact-header">
    <ion-icon name="paw-outline" color="primary" class="header-icon"></ion-icon>
    <h2>¿Quieres Ayudar?</h2>
    <p>Comunícate con nuestros refugios asociados para donaciones, voluntariado o adopciones.</p>
  </div>

  <ion-card class="premium-card">
    <ion-card-content>
      <!-- Nombre remitente -->
      <ion-item lines="full">
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Nombre completo" labelPlacement="stacked" [(ngModel)]="senderName" placeholder="Tu nombre" [disabled]="isSending"></ion-input>
      </ion-item>
      
      <!-- Correo electrónico remitente -->
      <ion-item lines="full">
        <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Correo electrónico" labelPlacement="stacked" type="email" [(ngModel)]="senderEmail" placeholder="Tu correo electrónico" [disabled]="isSending"></ion-input>
      </ion-item>

      <!-- Asunto -->
      <ion-item lines="full">
        <ion-icon name="information-circle-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Asunto" labelPlacement="stacked" [(ngModel)]="subject" placeholder="Motivo de tu mensaje" [disabled]="isSending"></ion-input>
      </ion-item>

      <!-- Mensaje -->
      <ion-item lines="none">
        <ion-icon name="document-text-outline" slot="start" color="medium"></ion-icon>
        <ion-textarea label="Mensaje" labelPlacement="stacked" rows="4" [(ngModel)]="message" placeholder="Escribe aquí tu mensaje..." [disabled]="isSending"></ion-textarea>
      </ion-item>

      <!-- Botón Enviar con Spinner -->
      <ion-button expand="block" shape="round" class="ion-margin-top action-btn" (click)="sendMessage()" [disabled]="isSending">
        <ion-spinner name="crescent" slot="start" *ngIf="isSending"></ion-spinner>
        <ion-icon slot="start" name="send-outline" *ngIf="!isSending"></ion-icon>
        {{ isSending ? 'Enviando Mensaje...' : 'Enviar Mensaje' }}
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-list lines="none" class="ion-margin-top support-list">
    <ion-list-header>Otras formas de contacto</ion-list-header>
    <ion-item detail="true" button href="https://wa.me/1234567890?text=Hola,%20me%20gustar%C3%ADa%20adoptar" target="_blank">
      <ion-icon name="logo-whatsapp" slot="start" color="success"></ion-icon>
      <ion-label>WhatsApp</ion-label>
    </ion-item>
    <ion-item detail="true" button href="mailto:hola@adoptapet.com">
      <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Correo Electrónico</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
